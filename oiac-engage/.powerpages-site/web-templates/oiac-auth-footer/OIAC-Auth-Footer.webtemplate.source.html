{% assign auth_path = request.path | downcase %}
{% if auth_path == '/signin' or auth_path == '/register' or auth_path contains '/account/login' %}
  <footer class="auth-site-footer">
    <div class="auth-site-footer__inner">
      <div class="auth-site-footer__identity">
        <img src="/logo.png" alt="">
        <span>Organization of Iranian American Communities &ndash; U.S.</span>
      </div>
      <nav aria-label="Footer navigation">
        <a href="https://oiac.org/" target="_blank" rel="noopener noreferrer">oiac.org</a>
        <a href="/resources">Resources</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </footer>
{% endif %}
